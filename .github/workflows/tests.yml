# Pipeline CI/CD (GitHub Actions) : à chaque push ou pull request vers main,
# GitHub lance automatiquement les tests du dossier tests/ (test_audit.py,
# test_scoring.py) sur une machine Ubuntu neuve, pour vérifier que le code
# métier de core/ fonctionne toujours avant d'accepter un changement.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer les tests
        run: pytest tests/ -v
        